<div class="back-row">
  <a mat-button routerLink="/claims"><mat-icon>arrow_back</mat-icon> Back to Claims</a>
</div>

<app-page-header title="Claim Details" [subtitle]="subtitle">
  <ng-container page-header-actions *ngIf="!loading() && details() as data">
    <ng-container *ngFor="let action of actions()">
      <a *ngIf="action.route" mat-flat-button color="primary" [routerLink]="actionRoute(action)">
        <mat-icon>{{ action.icon }}</mat-icon>{{ action.label }}
      </a>
      <button *ngIf="!action.route" mat-flat-button color="primary" type="button" (click)="runAction(action)">
        <mat-icon>{{ action.icon }}</mat-icon>{{ action.label }}
      </button>
    </ng-container>
  </ng-container>
</app-page-header>

<app-loading-indicator *ngIf="loading()" message="Loading claim details…"></app-loading-indicator>

<app-error-state *ngIf="!loading() && errorMessage()" title="Claim unavailable" [message]="errorMessage()!" (retryRequested)="retry()"></app-error-state>

<ng-container *ngIf="!loading() && details() as data">
  <app-claim-summary [claim]="data.claim"></app-claim-summary>

  <div class="detail-grid">
    <div class="main-column">
      <app-claim-timeline [history]="data.history"></app-claim-timeline>
      <app-claim-activity [activities]="data.history"></app-claim-activity>
    </div>
    <aside class="side-column" aria-label="Claim supporting information">
      <app-document-list
        [documents]="data.documents"
        [claimId]="data.claim.id"
        [uploadedBy]="data.claim.customer.name"
        [uploadEnabled]="canUploadDocuments()">
      </app-document-list>
      <mat-card class="contact-card">
        <span class="contact-icon"><mat-icon aria-hidden="true">support_agent</mat-icon></span>
        <div><strong>Need help with this claim?</strong><p>Contact your claims representative for assistance.</p></div>
      </mat-card>
    </aside>
  </div>
</ng-container>
