<app-page-header title="Claims" [subtitle]="pageSubtitle()">
  <a
    page-header-actions
    *appHasPermission="createPermission"
    mat-flat-button
    color="primary"
    routerLink="/claims/create">
    <mat-icon>add</mat-icon>
    Create Claim
  </a>
</app-page-header>

<mat-card class="filters-card" aria-label="Claim filters">
  <form class="filters-form" [formGroup]="filterForm">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search claims</mat-label>
      <input matInput formControlName="search" placeholder="Claim number, policy, or customer">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="">All statuses</mat-option>
        <mat-option *ngFor="let status of statusOptions" [value]="status">{{ statusLabel(status) }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Created from</mat-label>
      <input matInput type="date" formControlName="fromDate">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Created to</mat-label>
      <input matInput type="date" formControlName="toDate">
    </mat-form-field>

    <button mat-button type="button" class="clear-button" [disabled]="!hasActiveFilters()" (click)="clearFilters()">
      Clear filters
    </button>
  </form>
</mat-card>

<app-loading-indicator *ngIf="loading()" message="Loading claims…"></app-loading-indicator>

<app-error-state *ngIf="!loading() && errorMessage()" title="Claims unavailable" [message]="errorMessage()!" (retryRequested)="loadClaims()"></app-error-state>

<mat-card *ngIf="!loading() && !errorMessage()" class="claims-card">
  <div class="results-heading">
    <div>
      <h2>Claims register</h2>
      <p>{{ filteredClaims().length }} {{ filteredClaims().length === 1 ? 'claim' : 'claims' }} shown</p>
    </div>
  </div>

  <app-empty-state
    *ngIf="filteredClaims().length === 0"
    [title]="allClaims().length === 0 ? 'No claims assigned' : 'No matching claims'"
    [message]="allClaims().length === 0 ? 'Claims available to your role will appear here.' : 'Try adjusting your search or filters.'"
    [icon]="allClaims().length === 0 ? 'inbox' : 'search_off'"
    [actionLabel]="hasActiveFilters() ? 'Clear filters' : ''"
    (actionRequested)="clearFilters()">
  </app-empty-state>

  <app-claim-table *ngIf="filteredClaims().length > 0" [claims]="filteredClaims()"></app-claim-table>
</mat-card>
